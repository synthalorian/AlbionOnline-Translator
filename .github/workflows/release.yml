name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --draft --title "Albion Online Translator ${{ github.ref_name }}" --notes "See the assets below for your platform."

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
            rustflags: -Ctarget-feature=+crt-static
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --bundles app,dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Npcap SDK + extract runtime DLL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # --- 1) Npcap SDK (import lib + headers for compile-time) ---
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "npcap-sdk.zip"
          Expand-Archive npcap-sdk.zip -DestinationPath C:\npcap-sdk -Force
          "LIB=C:\npcap-sdk\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Npcap SDK extracted to C:\npcap-sdk"
          Get-ChildItem "C:\npcap-sdk\Lib\x64" | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

          # --- 2) Npcap installer (contains the actual wpcap.dll runtime) ---
          #     The SDK zip only has .lib import libraries — no DLLs.
          #     wpcap.dll only ships inside the NSIS installer.
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-1.78.exe" -OutFile "npcap-installer.exe"
          & 7z x npcap-installer.exe -o"C:\npcap-extract" -y | Out-Null

          # Find wpcap.dll + Packet.dll anywhere in the extracted tree.
          # Npcap's wpcap.dll STATICALLY IMPORTS packet.dll — bundling wpcap.dll
          # alone still fails to load at launch (Windows reports "wpcap.dll not
          # found" even though the missing piece is its dependency Packet.dll).
          $libDir = "C:\npcap-sdk\Lib\x64"
          foreach ($name in @("wpcap.dll", "Packet.dll")) {
            $dll = Get-ChildItem "C:\npcap-extract" -Recurse -Filter $name |
                   Sort-Object Length -Descending |
                   Select-Object -First 1
            if (-not $dll) {
              Write-Error "::error::$name not found inside npcap-1.78.exe — cannot bundle packet capture"
              exit 1
            }
            Copy-Item $dll.FullName "$libDir\$name" -Force
            $sizeKB = [math]::Round($dll.Length / 1024)
            Write-Host "✓ Extracted ${name}: $($dll.FullName) → $libDir\$name ($sizeKB KB)"
          }

          # Cleanup
          Remove-Item "C:\npcap-extract" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item npcap-installer.exe -ErrorAction SilentlyContinue

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          RUSTFLAGS: ${{ matrix.rustflags }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Albion Online Translator ${{ github.ref_name }}"
          releaseBody: "See the assets below for your platform."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.args }}
