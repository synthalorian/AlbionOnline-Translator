name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --draft --title "Albion Online Translator ${{ github.ref_name }}" --notes "See the assets below for your platform."

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
            rustflags: -Ctarget-feature=+crt-static
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --bundles app,dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Npcap SDK + extract runtime DLL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Download and extract Npcap SDK (for .lib import library)
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "npcap-sdk.zip"
          Expand-Archive npcap-sdk.zip -DestinationPath C:\npcap-sdk
          "LIB=C:\npcap-sdk\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Download Npcap installer to extract the actual runtime DLL(s)
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-1.78.exe" -OutFile "npcap-installer.exe"
          # Extract with 7z (available on Windows runners)
          & 7z x npcap-installer.exe -o"C:\npcap-dll" -r "*.dll" -y
          # Copy all DLLs into the SDK Lib\x64 folder so fix-paths.cjs finds them
          $libDir = "C:\npcap-sdk\Lib\x64"
          Get-ChildItem "C:\npcap-dll" -Recurse -Include "*.dll" | ForEach-Object {
            Copy-Item $_.FullName "$libDir\$($_.Name)" -Force
            Write-Host "::notice::Extracted DLL: $($_.Name)"
          }
          # Show what we landed with
          Write-Host "DLLs available in lib dir:"
          Get-ChildItem $libDir -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          # Cleanup
          Remove-Item "C:\npcap-dll" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item npcap-installer.exe -ErrorAction SilentlyContinue

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          RUSTFLAGS: ${{ matrix.rustflags }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Albion Online Translator ${{ github.ref_name }}"
          releaseBody: "See the assets below for your platform."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.args }}
