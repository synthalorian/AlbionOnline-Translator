[package]
name = "albion-translator"
version = "0.2.10"
default-run = "albion-translator"
description = "Albion Online chat translator overlay"
authors = ["synth"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "albion_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
pcap = { version = "2", features = ["capture-stream"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lingua = { version = "1.8.0", features = ["chinese", "japanese", "korean", "russian", "arabic", "thai", "portuguese", "spanish", "french", "german", "turkish", "english"] }
ct2rs = "0.10.0"
dirs = "6.0.0"
ctrlc = "3.5.2"
rusqlite = { version = "0.32", features = ["bundled"] }

# On non-English Windows, Npcap/wpcap error strings are localized in legacy
# codepages (CP1250 etc.) and fail pcap 2.x's strict UTF-8 check, masking the
# real error as "libpcap returned invalid UTF-8". Fork converts lossily.
# Upstream fix candidate: rust-pcap/pcap — drop this patch once merged.
[patch.crates-io]
pcap = { git = "https://github.com/synthalorian/pcap.git", branch = "lossy-utf8" }


